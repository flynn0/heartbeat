name: Heartbeat Cron & Delay Tracker

on:
  schedule:
    # Trigger every month on the 17th at 3:14 AM UTC
    - cron: '14 3 17 * *'
  workflow_dispatch:
    inputs:
      note:
        description: 'Optional note for manual trigger'
        required: false
        default: 'Manual health check'
  push:
    branches:
      - main
    paths-ignore:
      - 'data/**'
      - 'public/data/**'
      - 'public/api/**'
      - 'src/data/**'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'heartbeat-run'
  cancel-in-progress: false

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Record execution time and calculate delay
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_SHA: ${{ github.sha }}
          WORKFLOW_NOTE: ${{ github.event.inputs.note }}
        run: |
          TRIGGER="${{ github.event_name == 'schedule' && 'cron' || 'manual' }}"
          NOTE="${{ github.event.inputs.note }}"
          node scripts/record.js --trigger="$TRIGGER" --note="$NOTE"

      - name: Commit & push updated execution history
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ public/ src/data/
          if ! git diff --staged --quiet; then
            git commit -m "chore(heartbeat): record ${{ github.event_name }} execution and update API [skip ci]"
            git push
          else
            echo "No data changes to commit."
          fi

      - name: Build Vite Website
        run: npm run build

      - name: Setup Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main'
        id: deployment
        uses: actions/deploy-pages@v4
